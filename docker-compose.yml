services:
  mongo:
    image: mongo:7
    container_name: atlas-studio-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: atlas_studio
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: atlas-studio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

volumes:
  mongo_data:
